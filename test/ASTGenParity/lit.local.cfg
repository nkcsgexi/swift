# Diagnostic parity tests between the legacy C++ parser and ASTGen.
# Tests are generated by utils/astgen-parity/generate.py.

if 'swift_swift_parser' not in config.available_features:
    config.unsupported = True

# --param astgen_parity_mode=legacy          run the legacy parser instead
# --param astgen_parity_mode=harvest-legacy  legacy parser + diagnostic names
# --param astgen_parity_mode=harvest-new     ASTGen + diagnostic names
_mode = lit_config.params.get('astgen_parity_mode', '')
_overrides = {
    '': '',
    'legacy': '-disable-experimental-feature ParserASTGen',
    'harvest-legacy':
        '-disable-experimental-feature ParserASTGen -debug-diagnostic-names',
    'harvest-new': '-debug-diagnostic-names',
}
if _mode not in _overrides:
    lit_config.fatal('unknown astgen_parity_mode: %r' % _mode)
config.substitutions.insert(
    0, ('%{astgen-parity-override}', _overrides[_mode]))
